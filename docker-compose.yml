services:
  agent-api:
    build: .
    ports:
      - "127.0.0.1:8001:8001"
    env_file:
      - path: .env
        required: false
    environment:
      AGENT_NEWS_DIR: /app/data/raw/news
      AGENT_RETURNS_PATH: /app/data/processed/returns.parquet
      AGENT_CHROMA_DIR: /app/artifacts/chroma
      AGENT_RISK_TAGS_PATH: /app/artifacts/risk_tags.jsonl
    volumes:
      - agent-artifacts:/app/artifacts
      # data-pipeline 산출물(뉴스·공시 CSV, returns.parquet)을 읽기 전용으로 연결한다.
      - ${NEWS_DIR:-./data/raw/news}:/app/data/raw/news:ro
      - ${PROCESSED_DIR:-./data/processed}:/app/data/processed:ro
volumes:
  agent-artifacts:

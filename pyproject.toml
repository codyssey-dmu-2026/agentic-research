[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "codyssey-agentic-research"
version = "0.1.0"
description = "LangGraph agentic RAG research and risk tagging for the Codyssey robo-advisor"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "langgraph>=1.2,<2",
  "langchain-core>=1.6,<2",
  "chromadb>=1.5,<2",
  "pandas>=2.2,<3",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
openai = ["langchain-openai>=1.6,<2"]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "black>=24,<27", "flake8>=7,<8", "httpx>=0.27,<0.29"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.black]
line-length = 88
target-version = ["py312", "py313"]

[tool.coverage.run]
source = ["agentic_research"]

[tool.coverage.report]
show_missing = true
